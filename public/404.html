<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      sessionStorage.setItem(
        "redirect",
        window.location.pathname +
          window.location.search +
          window.location.hash
      );

      window.location.replace("/portfolio/");
    </script>
  </head>
  <body></body>
</html>
